<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ian — Computer Science Student, Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0f"/><stop offset="1" stop-color="#1a0b0e"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a1019" stop-opacity="0"/><stop offset=".5" stop-color="#b3202a"/><stop offset="1" stop-color="#e03a45"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b3202a" stop-opacity=".35"/><stop offset="1" stop-color="#b3202a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="990" cy="150" r="190" fill="url(#glow)"/>
  <!-- distant wall silhouette -->
  <path d="M0 270 L0 238 L120 238 L120 226 L260 226 L260 240 L420 240 L420 228 L600 228 L600 244 L800 244 L800 230 L1000 230 L1000 242 L1200 242 L1200 270Z" fill="#000" opacity=".35"/>
  <!-- animated scarf waves -->
  <path fill="none" stroke="url(#scarf)" stroke-width="14" stroke-linecap="round" opacity=".95">
    <animate attributeName="d" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
      values="M0 215 C200 170 360 260 560 215 S900 170 1200 215;M0 205 C200 255 360 175 560 215 S900 255 1200 205;M0 215 C200 170 360 260 560 215 S900 170 1200 215"/>
  </path>
  <path fill="none" stroke="#b3202a" stroke-width="5" stroke-linecap="round" opacity=".5">
    <animate attributeName="d" dur="6.5s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"
      values="M0 238 C250 205 400 275 620 238 S950 205 1200 238;M0 228 C250 270 400 200 620 238 S950 270 1200 228;M0 238 C250 205 400 275 620 238 S950 205 1200 238"/>
  </path>
  <!-- Wings of Freedom (original stylised mark) -->
  <g transform="translate(990 140)" fill="none" stroke-linejoin="round">
    <g stroke="#e8e8ec" stroke-width="3" opacity=".9">
      <path d="M-6 -4 L-60 -70 L-120 -60 L-70 -20 L-110 -8 L-62 16 L-92 40 L-30 34 L-6 56Z" fill="#e8e8ec" fill-opacity=".08"/>
      <path d="M6 -4 L60 -70 L120 -60 L70 -20 L110 -8 L62 16 L92 40 L30 34 L6 56Z" fill="#e8e8ec" fill-opacity=".08"/>
    </g>
    <path d="M-6 -4 L-60 -70 L-120 -60 L-70 -20 L-110 -8 L-62 16 L-92 40 L-30 34 L-6 56Z" stroke="#b3202a" stroke-width="1.5" transform="translate(4 4)" opacity=".7"/>
    <path d="M6 -4 L60 -70 L120 -60 L70 -20 L110 -8 L62 16 L92 40 L30 34 L6 56Z" stroke="#b3202a" stroke-width="1.5" transform="translate(-4 4)" opacity=".7"/>
    <animateTransform attributeName="transform" type="translate" values="990 140;990 130;990 140" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </g>
  <!-- text -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="70" y="108" fill="#b3202a" font-size="15" letter-spacing="6" font-weight="600">HI, I'M</text>
    <text x="66" y="178" fill="#f4f4f6" font-size="76" font-weight="800" letter-spacing="2">IAN<tspan fill="#b3202a">.</tspan></text>
    <text x="70" y="212" fill="#c9c9c9" font-size="21" letter-spacing="1">Computer Science Student  ·  Full-Stack Developer</text>
    <rect x="70" y="224" width="120" height="3" fill="#b3202a">
      <animate attributeName="width" values="40;240;40" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="1180" y="284" text-anchor="end" fill="#8a8a90" font-size="12" font-family="Arial,sans-serif" letter-spacing="3">心臓を捧げよ</text>
</svg>
