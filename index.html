  <!-- Tailwind CSS (utility classes for layout only -- colors and
       typography come from the bryl-minimal tokens in src/styles/theme.css,
       loaded via main.tsx). -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Font lock.
       Tailwind's Play CDN ships the platform's own stacks, and its default
       `font-serif` is `ui-serif, Georgia, Cambria, "Times New Roman", Times,
       serif` -- so a `font-serif` class anywhere would put a system serif on
       the page. The three font-family utilities are pointed at the tokens in
       src/styles/theme.css instead, which makes a `font-sans`, `font-mono` or
       `font-serif` class resolve only to Geist, Kode Mono or Source Serif 4.

       The tokens stay the single source of truth: this names them rather than
       restating the stacks, so a stack is still edited in exactly one place.
       `extend` rather than a bare `fontFamily` so the rest of the default
       theme (spacing, breakpoints, the grid and flex utilities the layout
       depends on) is left alone.

       Must stay after the CDN script, which is what defines `tailwind.config`
       in the first place. */
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ["var(--font-mono)"],
            sans: ["var(--font-body)"],
            serif: ["var(--font-serif)"],
          },
        },
      },
    };
  </script>

  <!-- Devicon: technology icons used in the tech-stack section. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@2.17.0/devicon.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@2.17.0/devicon.min.css" /></noscript>

  <!-- Typography: the roles of the bryl-minimal stack.
       Display + Mono -- Kode Mono      (headings, labels, nav, UI chrome)
       Body           -- Geist          (UI copy, buttons, subheadings)
       Serif          -- Source Serif 4 (prose, institutions, dates)
       Loaded here, once, rather than injected per-component at runtime.
       Source Serif 4 is requested in both upright and italic (`ital,opsz,wght`)
       because the Education section sets its "Currently studying" subtitle in
       italic. Requesting only the upright cut would leave that line rendered as
       a synthetic oblique -- a sheared upright, which reads as broken rather
       than italic at small sizes. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Kode+Mono:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap"
    rel="stylesheet"
  />

  <!-- No-flash theme init: read the stored/system preference before
       first paint, so there's no light->dark flash on load. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
