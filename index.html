<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marianne Napaño ― Computer Science Student &amp; Aspiring Web Developer</title>
  <meta name="description" content="Portfolio of Marianne Napaño, a Computer Science student and aspiring web developer building projects with HTML, CSS, and JavaScript." />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="light dark" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="MRN | Computer Science Student &amp; Aspiring Web Developer" />
  <meta property="og:description" content="Portfolio of Marianne Napaño, a Computer Science student and aspiring web developer building projects with HTML, CSS, and JavaScript." />
  <meta property="og:site_name" content="Marianne Napaño" />
  <meta property="og:locale" content="en_US" />
  <!-- Relative until the canonical URL is known; replace with absolute together with og:url. -->
  <meta property="og:image" content="/images/anime-480w.webp" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="MRN | Computer Science Student &amp; Aspiring Web Developer" />
  <meta name="twitter:description" content="Portfolio of Marianne Napaño, a Computer Science student and aspiring web developer building projects with HTML, CSS, and JavaScript." />
  <meta name="twitter:image" content="/images/anime-480w.webp" />

  <link rel="icon" type="image/png" href="/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-180.png" />
  <!-- Tailwind CSS (utility classes for layout only -- colors and
       typography come from the bryl-minimal tokens in src/styles/theme.css,
       loaded via main.tsx). -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Devicon: technology icons used in the tech-stack section. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@2.17.0/devicon.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@2.17.0/devicon.min.css" /></noscript>

  <!-- Typography: the roles of the bryl-minimal stack.
       Display + Mono -- Kode Mono      (headings, labels, nav, UI chrome)
       Body           -- Geist          (UI copy, buttons, subheadings)
       Serif          -- Source Serif 4 (long-form prose, upright only)
       Loaded here, once, rather than injected per-component at runtime. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Kode+Mono:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap"
    rel="stylesheet"
  />

  <!-- No-flash theme init: read the stored/system preference before
       first paint, so there's no light->dark flash on load. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
